name: CI

# Test/build gate for branches and PRs. Releases are driven by pushing a v* tag, handled
# by publish.yml (npm trusted publishing).
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The build/test toolchain (react-scripts 3, microbundle-crl) requires Node 16 (.nvmrc).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests, lint and build
        run: npm test
