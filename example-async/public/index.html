<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Featureflow Async Provider Example</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      // Polyfill for process (required by some dependencies in browser environments)
      (function() {
        if (typeof process === 'undefined') {
          window.process = { env: {} };
          if (typeof global !== 'undefined') {
            global.process = window.process;
          }
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
